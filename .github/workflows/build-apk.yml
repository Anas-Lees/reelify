name: Build Android APK

# Builds a sideloadable debug APK whenever you push, or run manually from the
# Actions tab ("workflow_dispatch"). The APK lands in the workflow's Artifacts
# section — download, transfer to phone, install.

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "BUILD.md"
      - "README.md"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      backend_url:
        description: "Backend URL the app should talk to (e.g. https://reelify.onrender.com)"
        required: false
        default: ""

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Override backend URL (if provided)
        if: ${{ github.event.inputs.backend_url != '' }}
        run: |
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
            cfg.server = cfg.server || {};
            cfg.server.url = '${{ github.event.inputs.backend_url }}';
            cfg.server.androidScheme = 'https';
            cfg.server.cleartext = false;
            fs.writeFileSync('capacitor.config.json', JSON.stringify(cfg, null, 2));
            console.log('Updated capacitor.config.json server.url ->', cfg.server.url);
          "

      - name: Sync Capacitor → Android
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x ./android/gradlew

      - name: Build debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: reelify-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

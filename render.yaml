services:
  - type: web
    name: reelify
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false   # required — used for text generation (reels, quiz)
                      # and image generation. NOT used for TTS anymore;
                      # the preview-TTS rate limits made it unusable.
      - key: GOOGLE_CLOUD_API_KEY
        sync: false   # OPTIONAL UPGRADE — better-quality TTS (Neural2
                      # voices). 1M chars/mo free, then $4/M Standard.
                      # Need to enable "Cloud Text-to-Speech API" on your
                      # Google Cloud project. Without this key, audio
                      # uses StreamElements (free, no quota) by default.
      - key: OPENAI_API_KEY
        sync: false   # OPTIONAL UPGRADE — best-quality TTS (tts-1,
                      # nova/onyx voices). $0.015 per 1k chars. Used only
                      # if Google Cloud TTS isn't configured / unavailable.
                      # Without this key, audio uses StreamElements (free).
      - key: DATABASE_URL
        sync: false   # Neon / Supabase / any Postgres connection string
      - key: JWT_SECRET
        generateValue: true   # Render auto-generates a strong random; reused across redeploys
